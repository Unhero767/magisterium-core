name: Logic Storm Guard (CI)
on:
  push:
    branches: [ "main" ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validation-ritual:
    name: Execute Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Manifold Retrieval
        uses: actions/checkout@v4
      - name: Syntax Scan
        run: |
          if [ -f README.md ]; then
            echo "README.md verified. Structural integrity confirmed."
          else
            echo "ERROR: README.md missing!"
            exit 1
          fi
